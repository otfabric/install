name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    # Weekly: the org scan, and the live service smoke test.
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Registry, shellcheck, PSScriptAnalyzer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Registry in sync with tools.json
        run: python3 -I scripts/registry.py --check
      - name: shellcheck
        run: shellcheck -s sh install.sh tests/run.sh
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-PSResource PSScriptAnalyzer -TrustRepository -Quiet
          $r = Invoke-ScriptAnalyzer -Path ./install.ps1, ./tests/install.Tests.ps1 -Severity Warning, Error `
            -ExcludeRule PSAvoidUsingWriteHost, PSUseShouldProcessForStateChangingFunctions
          $r | Format-Table -AutoSize | Out-String -Width 200
          if ($r) { exit 1 }

  unix:
    name: ${{ matrix.os }} / ${{ matrix.shell }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shell: dash, target: linux-amd64 }
          - { os: ubuntu-latest, shell: bash, target: linux-amd64 }
          - { os: ubuntu-24.04-arm, shell: dash, target: linux-arm64 }
          - { os: macos-latest, shell: sh, target: darwin-arm64 }
          - { os: macos-latest, shell: zsh, target: darwin-arm64 }
          - { os: macos-15-intel, shell: sh, target: darwin-amd64 }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: End-to-end tests
        env:
          EXPECT_TARGET: ${{ matrix.target }}
        run: sh tests/run.sh ${{ matrix.shell }}

  containers:
    name: container / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: alpine (busybox ash + wget)
            image: alpine:3
            platform: linux/amd64
            setup: apk add -q python3
            shell: sh
            target: linux-amd64
          - name: debian (dash + GNU wget, no curl)
            image: debian:stable-slim
            platform: linux/amd64
            setup: apt-get -qq update && apt-get -qq install -y wget python3 >/dev/null
            shell: dash
            target: linux-amd64
          - name: raspberry pi os style armv7
            image: arm32v7/debian:stable-slim
            platform: linux/arm/v7
            setup: apt-get -qq update && apt-get -qq install -y curl python3 >/dev/null
            shell: dash
            target: linux-armv7
          - name: alpine armv7 (busybox)
            image: arm32v7/alpine:3
            platform: linux/arm/v7
            setup: apk add -q python3
            shell: sh
            target: linux-armv7
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
        if: matrix.platform != 'linux/amd64'
      - name: End-to-end tests
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD:/src:ro" -w /src \
            -e EXPECT_TARGET=${{ matrix.target }} ${{ matrix.image }} \
            sh -c '${{ matrix.setup }} && sh tests/run.sh ${{ matrix.shell }}'

  windows:
    name: ${{ matrix.os }} / ${{ matrix.shell }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Pester tests
        shell: pwsh
        env:
          OTF_TEST_SHELL: ${{ matrix.shell }}
        run: |
          Install-PSResource Pester -TrustRepository -Quiet -Version '[5.5,6.0)'
          Import-Module Pester -MinimumVersion 5.5
          $c = New-PesterConfiguration
          $c.Run.Path = 'tests/install.Tests.ps1'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c

  real-releases:
    name: real releases / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install from GitHub directly (Unix)
        if: runner.os != 'Windows'
        run: |
          d=$(mktemp -d)
          OTF_UNMANAGED_INSTALL="$d" OTF_VERSION=3.5.1 sh install.sh modbusctl
          "$d/modbusctl" version | grep -q 3.5.1
          OTF_UNMANAGED_INSTALL="$d" OTF_VERSION=1.8.1 sh install.sh sclparse
          "$d/sclparse" version | grep -q 1.8.1
      - name: Install from GitHub directly (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'otf'
          $env:OTF_UNMANAGED_INSTALL = $d; $env:OTF_VERSION = '3.5.1'
          powershell -NoProfile -File install.ps1 modbusctl
          if ($LASTEXITCODE) { exit 1 }
          & "$d\modbusctl.exe" version | Select-String 3.5.1 | Out-Null
          if (-not $?) { exit 1 }

  org-scan:
    name: Released binaries are registered
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -I scripts/org_scan.py
        env:
          GH_TOKEN: ${{ github.token }}

  live:
    name: get.otfabric.io / ${{ matrix.os }}
    # Set the repository variable SERVICE_LIVE=true once the Worker is deployed.
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.SERVICE_LIVE == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Install through the service (Unix)
        if: runner.os != 'Windows'
        run: |
          d=$(mktemp -d)
          curl -fsSL https://get.otfabric.io/modbusctl | env OTF_UNMANAGED_INSTALL="$d" sh
          "$d/modbusctl" version
      - name: Install through the service (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:OTF_UNMANAGED_INSTALL = Join-Path $env:RUNNER_TEMP 'otf'
          irm https://get.otfabric.io/modbusctl.ps1 | iex
          & "$env:OTF_UNMANAGED_INSTALL\modbusctl.exe" version
          if ($LASTEXITCODE) { exit 1 }
